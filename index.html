
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <div class="form-card">
            <h1>Form Pendaftaran</h1>
            <p class="subtitle">Silakan lengkapi data diri Anda.</p>

            <form id="registrationForm" novalidate>

                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" placeholder="Masukkan nama lengkap">
                    <small id="namaError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="text" id="email" placeholder="nama@email.com">
                    <small id="emailError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Minimal 6 karakter">
                    <small id="passwordError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Konfirmasi Password</label>
                    <input type="password" id="confirmPassword" placeholder="Masukkan ulang password">
                    <small id="confirmPasswordError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="telepon">Nomor Telepon</label>
                    <input type="text" id="telepon" placeholder="Contoh: 081234567890">
                    <small id="teleponError" class="error"></small>
                </div>

                <div class="form-group">
                    <label>Jenis Kelamin</label>

                    <div class="options">
                        <label>
                            <input type="radio" name="gender" value="Laki-laki">
                            Laki-laki
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Perempuan">
                            Perempuan
                        </label>
                    </div>

                    <small id="genderError" class="error"></small>
                </div>

                <div class="form-group">
                    <label>Hobi</label>

                    <div class="options">
                        <label>
                            <input type="checkbox" name="hobi" value="Membaca">
                            Membaca
                        </label>

                        <label>
                            <input type="checkbox" name="hobi" value="Olahraga">
                            Olahraga
                        </label>

                        <label>
                            <input type="checkbox" name="hobi" value="Musik">
                            Musik
                        </label>
                    </div>

                    <small id="hobiError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="negara">Negara</label>

                    <select id="negara">
                        <option value="">-- Pilih Negara --</option>
                        <option value="Indonesia">Indonesia</option>
                        <option value="Malaysia">Malaysia</option>
                        <option value="Singapura">Singapura</option>
                        <option value="Thailand">Thailand</option>
                    </select>

                    <small id="negaraError" class="error"></small>
                </div>

                <button type="submit">Daftar Sekarang</button>

                <p id="message"></p>

            </form>
        </div>
    </div>

</body>
</html>
